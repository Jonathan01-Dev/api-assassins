<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Archipel GUI</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background:#0b0b0f; color:#eaeaf2; }
      header { padding: 12px 16px; border-bottom: 1px solid #222; display:flex; align-items:center; gap:12px; }
      .wrap { padding: 16px; }
      .row { display:flex; gap:10px; align-items:center; margin-bottom: 12px; }
      input {
        background:#11111a; color:#eaeaf2; border:1px solid #222; border-radius:8px;
        padding:8px 10px; width:110px;
      }
      button {
        background:#1a1a26; color:#eaeaf2; border:1px solid #2b2b3d; border-radius:10px;
        padding:8px 12px; cursor:pointer;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .badge { font-size:12px; padding:4px 8px; border:1px solid #2b2b3d; border-radius:999px; }
      .logs {
        background:#11111a;
        border:1px solid #222;
        border-radius:10px;
        padding:12px;
        height:520px;
        overflow:auto;
        white-space:pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <b>Archipel GUI</b>
      <span id="status" class="badge">status: unknown</span>
    </header>

    <div class="wrap">
      <div class="row">
        <label>TCP port</label>
        <input id="port" type="number" value="7777" min="1" max="65535" />
        <button id="startBtn">Start Node</button>
        <button id="stopBtn" disabled>Stop Node</button>
        <button id="clearBtn">Clear logs</button>
      </div>

      <div id="logs" class="logs"></div>
    </div>

    <script>
      const logsEl = document.getElementById("logs");
      const statusEl = document.getElementById("status");
      const portEl = document.getElementById("port");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const clearBtn = document.getElementById("clearBtn");

      function addLog(line) {
        const ts = new Date().toLocaleTimeString();
        logsEl.textContent += `[${ts}] ${line}\n`;
        logsEl.scrollTop = logsEl.scrollHeight;
      }

      function setRunning(running) {
        statusEl.textContent = `status: ${running ? "running" : "stopped"}`;
        startBtn.disabled = running;
        stopBtn.disabled = !running;
      }

      clearBtn.addEventListener("click", () => (logsEl.textContent = ""));

      startBtn.addEventListener("click", async () => {
        const port = Number(portEl.value || 7777);
        addLog(`[GUI] starting node on TCP_PORT=${port} ...`);
        try {
          await window.api.startNode(port);
          setRunning(true);
        } catch (e) {
          addLog(`[GUI] start error: ${e.message}`);
        }
      });

      stopBtn.addEventListener("click", async () => {
        try {
          await window.api.stopNode();
          setRunning(false);
        } catch (e) {
          addLog(`[GUI] stop error: ${e.message}`);
        }
      });

      window.api.onLog(addLog);
      window.api.onStatus((st) => setRunning(!!st.running));

      window.api.ready();
    </script>
  </body>
</html>
