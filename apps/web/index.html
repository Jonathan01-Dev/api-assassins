<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API ASSASSAINS Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>

    <header class="topbar">
      <div class="brand-wrap">
        <img class="brand-logo" src="/assets/apiassassains.png" alt="API ASSASSAINS" />
        <div>
          <p class="eyebrow">ARCHIPEL CHAT</p>
          <h1>API ASSASSAINS</h1>
          <p class="slogan">Nah We'd win</p>
        </div>
      </div>
      <div class="connection" id="connectionState">Connexion: ...</div>
    </header>

    <main class="app-shell">
      <aside class="sidebar">
        <section class="panel">
          <h2>Contacts</h2>
          <div class="my-node-tools">
            <div class="small mono" id="meNode">Mon node: ...</div>
            <div class="row tight">
              <button id="copyMyIdBtn" type="button">Copier mon ID</button>
              <button id="pastePeerBtn" type="button" class="ghost">Coller ID</button>
            </div>
          </div>
          <div id="peerList" class="peer-list"></div>
        </section>

        <section class="panel">
          <h2>Fichiers reçus/disponibles</h2>
          <div id="fileList" class="file-list"></div>
        </section>
      </aside>

      <section class="chat-shell">
        <div class="chat-head">
          <div>
            <div class="small">Destinataire actuel</div>
            <div id="chatPeerTitle" class="chat-peer-title">Aucun pair sélectionné</div>
          </div>
          <div class="head-actions">
            <input id="manualPeerInput" placeholder="Coller node_id ici" />
            <button id="usePeerBtn" type="button">Utiliser</button>
            <button id="trustBtn" type="button">Trust</button>
            <button id="notifBtn" type="button">Notifications</button>
          </div>
        </div>

        <div id="messageList" class="message-list"></div>

        <form id="msgForm" class="composer">
          <input id="msgInput" placeholder="Écrire un message..." autocomplete="off" required />
          <button type="submit">Envoyer</button>
        </form>
      </section>
    </main>

    <button id="docFab" class="doc-fab" type="button">Envoyer document</button>

    <div id="docModal" class="modal hidden">
      <div class="modal-card">
        <h3>Envoi de document</h3>
        <form id="sendForm" class="stack">
          <input id="docTargetInput" name="nodeId" placeholder="node_id destinataire" required />
          <input id="docPathInput" name="filePath" placeholder="/chemin/vers/fichier" required />
          <div class="row">
            <button type="submit">Partager</button>
            <button id="closeModalBtn" type="button" class="ghost">Fermer</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="/app.js"></script>
  </body>
</html>
